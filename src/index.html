<!DOCTYPE html>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>canva clone</title>

			<div class="project">

			<div class="templates">

			</div>

				<button class="canva_ai"><div class="p3"></div>Canva AI</button>

			</div>

			<div class="festivals">

				<div class="fest2"></div>
				<div class="fest3"></div>
				<div class="fest4"></div>
				<div class="fest5"></div>

			<div class="recent_feature">Recent</div>
